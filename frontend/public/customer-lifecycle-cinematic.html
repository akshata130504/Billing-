<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rooman Billing — Customer Lifecycle Cinematic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #040714;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 16:9 Cinematic Viewport Container */
    .cinematic-container {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 */
      max-height: 100vh;
      max-width: 177.78vh; /* 16:9 */
      background: #040714;
      overflow: hidden;
      box-shadow: 0 0 120px rgba(15, 23, 64, 0.8), 0 0 2px rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Ambient Cinema Overlay & Film Vignette */
    .vignette-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(4, 7, 20, 0.5) 75%, rgba(4, 7, 20, 0.95) 100%);
      mix-blend-mode: multiply;
    }

    .anamorphic-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(63, 81, 201, 0.03) 0%, transparent 50%, rgba(232, 62, 140, 0.03) 100%);
    }

    /* Top Brand Minimal Watermark */
    .brand-header {
      position: absolute;
      top: 2.8vw;
      left: 3.5vw;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 0.9vw;
      pointer-events: none;
    }

    .brand-logo-pill {
      display: flex;
      align-items: center;
      gap: 0.6vw;
      padding: 0.4vw 0.9vw;
      background: rgba(15, 23, 50, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
    }

    .brand-dot {
      width: 0.45vw;
      height: 0.45vw;
      background: #E83E8C;
      border-radius: 50%;
      box-shadow: 0 0 10px #E83E8C;
    }

    .brand-name {
      font-size: 0.8vw;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
    }

    .brand-tag {
      font-size: 0.65vw;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.6);
    }

    /* Center Stage Cinematic Indicator */
    .stage-hud {
      position: absolute;
      bottom: 4.8vw;
      left: 3.5vw;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 0.35vw;
      transition: opacity 0.4s ease;
    }

    .stage-sequence {
      display: flex;
      align-items: center;
      gap: 0.5vw;
      font-size: 0.65vw;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #38BDF8;
      transition: color 0.5s ease;
    }

    .stage-sequence .num {
      padding: 0.15vw 0.4vw;
      border-radius: 0.25vw;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .stage-title {
      font-size: 1.85vw;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #FFFFFF;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: baseline;
      gap: 0.6vw;
    }

    .stage-meta {
      font-size: 0.75vw;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: rgba(148, 163, 184, 0.7);
      text-transform: uppercase;
    }

    /* Top Right Timeline / Quality Indicator */
    .cinematic-meta-right {
      position: absolute;
      top: 2.8vw;
      right: 3.5vw;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 1.2vw;
      pointer-events: none;
    }

    .quality-badge {
      padding: 0.3vw 0.7vw;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.3vw;
      font-size: 0.6vw;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
    }

    .time-display {
      font-family: monospace;
      font-size: 0.8vw;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.8);
    }

    /* Sleek Bottom Control Bar */
    .controls-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 1.5vw 3.5vw 2vw 3.5vw;
      background: linear-gradient(180deg, transparent 0%, rgba(4, 7, 20, 0.85) 100%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 0.8vw;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cinematic-container:hover .controls-overlay {
      opacity: 1;
    }

    .timeline-bar-wrapper {
      position: relative;
      width: 100%;
      height: 0.4vw;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      cursor: pointer;
    }

    .timeline-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3F51C9 0%, #6C2BD9 35%, #E83E8C 70%, #10B981 100%);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
    }

    .timeline-markers {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
    }

    .timeline-marker-dot {
      width: 0.4vw;
      height: 0.4vw;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .control-btn-group {
      display: flex;
      align-items: center;
      gap: 0.8vw;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #F8FAFC;
      border-radius: 0.4vw;
      padding: 0.4vw 0.8vw;
      font-size: 0.7vw;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4vw;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .speed-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38BDF8;
      color: #38BDF8;
    }
  </style>
</head>
<body>

  <div class="cinematic-container" id="cinematicContainer">
    <canvas id="cinemaCanvas"></canvas>
    <div class="anamorphic-line"></div>
    <div class="vignette-overlay"></div>

    <!-- Header Brand Watermark -->
    <div class="brand-header">
      <div class="brand-logo-pill">
        <div class="brand-dot"></div>
        <span class="brand-name">Rooman Billing</span>
      </div>
      <span class="brand-tag">Customer Lifecycle · 10s Cinematic</span>
    </div>

    <!-- Right Metadata -->
    <div class="cinematic-meta-right">
      <div class="quality-badge">4K · 60 FPS UHD</div>
      <div class="time-display" id="timeDisplay">00:00 / 00:10</div>
    </div>

    <!-- Dynamic Stage HUD Indicator -->
    <div class="stage-hud" id="stageHud">
      <div class="stage-sequence" id="stageSequence">
        <span class="num" id="stageNum">01</span>
        <span id="stagePhase">STAGE 1 OF 5</span>
      </div>
      <div class="stage-title" id="stageTitle">
        <span id="stageName">NEW</span>
      </div>
      <div class="stage-meta" id="stageMeta">Acquisition & First Signal</div>
    </div>

    <!-- Sleek Timeline & Playback Bar -->
    <div class="controls-overlay">
      <div class="timeline-bar-wrapper" id="timelineWrapper">
        <div class="timeline-progress" id="timelineProgress"></div>
        <div class="timeline-markers">
          <span class="timeline-marker-dot" style="left: 0%"></span>
          <span class="timeline-marker-dot" style="left: 20%"></span>
          <span class="timeline-marker-dot" style="left: 40%"></span>
          <span class="timeline-marker-dot" style="left: 62%"></span>
          <span class="timeline-marker-dot" style="left: 82%"></span>
          <span class="timeline-marker-dot" style="left: 100%"></span>
        </div>
      </div>
      <div class="controls-row">
        <div class="control-btn-group">
          <button class="control-btn" id="playBtn">
            <svg id="playIcon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
            <span id="playText">Pause</span>
          </button>
          <button class="control-btn" id="restartBtn">Replay</button>
        </div>
        <div class="control-btn-group">
          <button class="control-btn speed-btn" data-speed="0.5">0.5x Slow</button>
          <button class="control-btn speed-btn active" data-speed="1.0">1.0x Realtime</button>
          <button class="control-btn speed-btn" data-speed="1.5">1.5x Fast</button>
          <button class="control-btn" id="fsBtn">Fullscreen</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const container = document.getElementById('cinematicContainer');
      const canvas = document.getElementById('cinemaCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });

      const timeDisplay = document.getElementById('timeDisplay');
      const timelineProgress = document.getElementById('timelineProgress');
      const timelineWrapper = document.getElementById('timelineWrapper');
      const playBtn = document.getElementById('playBtn');
      const playText = document.getElementById('playText');
      const playIcon = document.getElementById('playIcon');
      const restartBtn = document.getElementById('restartBtn');
      const fsBtn = document.getElementById('fsBtn');
      const speedBtns = document.querySelectorAll('.speed-btn');

      const stageNum = document.getElementById('stageNum');
      const stageSequence = document.getElementById('stageSequence');
      const stageName = document.getElementById('stageName');
      const stageMeta = document.getElementById('stageMeta');

      // Internal 4K 16:9 Cinema Buffer (3840 x 2160)
      const WIDTH = 3840;
      const HEIGHT = 2160;
      canvas.width = WIDTH;
      canvas.height = HEIGHT;

      // 10-Second Cinematic Master Timeline
      const DURATION = 10.0;
      let currentTime = 0.0;
      let isPlaying = true;
      let playbackSpeed = 1.0;
      let lastTimestamp = performance.now();

      // Lifecycle Stages Master Config
      const STAGES = [
        {
          id: 'NEW',
          label: 'NEW',
          num: '01',
          timeRange: [0.0, 2.0],
          meta: 'Acquisition & First Signal',
          color: '#38BDF8',
          glow: 'rgba(56, 189, 248, 0.85)',
          val: '1.0x',
        },
        {
          id: 'ACTIVE',
          label: 'ACTIVE',
          num: '02',
          timeRange: [2.0, 4.0],
          meta: 'Engagement & Value Realization',
          color: '#8B5CF6',
          glow: 'rgba(139, 92, 246, 0.9)',
          val: '2.4x',
        },
        {
          id: 'SUBSCRIBED',
          label: 'SUBSCRIBED',
          num: '03',
          timeRange: [4.0, 6.2],
          meta: 'Recurring Revenue Anchor',
          color: '#E83E8C',
          glow: 'rgba(232, 62, 140, 0.95)',
          val: '5.8x',
        },
        {
          id: 'RENEWING',
          label: 'RENEWING',
          num: '04',
          timeRange: [6.2, 8.2],
          meta: 'Compounding Trust & Retention',
          color: '#10B981',
          glow: 'rgba(16, 185, 129, 0.95)',
          val: '12.0x',
        },
        {
          id: 'GROWING',
          label: 'GROWING',
          num: '05',
          timeRange: [8.2, 10.0],
          meta: 'Ecosystem Expansion & Multi-Seat Scale',
          color: '#34D399',
          glow: 'rgba(52, 211, 153, 1.0)',
          val: '25.0x',
        },
      ];

      // Geometry & Pathing
      const CENTER_X = WIDTH * 0.50;
      const CENTER_Y = HEIGHT * 0.50;
      const RADIUS_X = WIDTH * 0.28;
      const RADIUS_Y = HEIGHT * 0.32;
      const TILT_ANGLE = -0.15; // Radians

      function getOrbitPoint(angleRad, rx = RADIUS_X, ry = RADIUS_Y, cx = CENTER_X, cy = CENTER_Y, tilt = TILT_ANGLE) {
        const cosA = Math.cos(angleRad);
        const sinA = Math.sin(angleRad);
        const unrotatedX = rx * cosA;
        const unrotatedY = ry * sinA;
        const rotX = unrotatedX * Math.cos(tilt) - unrotatedY * Math.sin(tilt);
        const rotY = unrotatedX * Math.sin(tilt) + unrotatedY * Math.cos(tilt);
        return { x: cx + rotX, y: cy + rotY };
      }

      // 5 Stage Spatial Angles along the Lifecycle Ellipse (Radians)
      // 0s-2s: entrance from upper-left into angle 3.6 (NEW)
      // 2s-4s: angle 3.6 -> 4.9 (ACTIVE)
      // 4s-6.2s: angle 4.9 -> 6.4 (SUBSCRIBED)
      // 6.2s-8.2s: angle 6.4 -> 8.0 (RENEWING)
      // 8.2s-10s: angle 8.0 -> 9.88 (GROWING)
      const START_ANGLE = 3.4;
      const TOTAL_TRAVEL_RADIANS = Math.PI * 2.15;

      // Primary Hero Node Stardust Trails
      const particleTrail = [];
      const MAX_TRAIL = 180;

      // Background Digital Space Particles
      const bgCosmicParticles = [];
      for (let i = 0; i < 240; i++) {
        bgCosmicParticles.push({
          x: Math.random() * WIDTH,
          y: Math.random() * HEIGHT,
          r: Math.random() * 2.2 + 0.6,
          alpha: Math.random() * 0.55 + 0.15,
          speed: Math.random() * 0.3 + 0.1,
          phase: Math.random() * Math.PI * 2,
          color: i % 3 === 0 ? '#3F51C9' : i % 3 === 1 ? '#6C2BD9' : '#00E5FF'
        });
      }

      // Secondary Interconnected Customer Journeys (Ecosystem)
      // 12 Secondary orbits that fade in as primary node grows
      const secondaryJourneys = [];
      for (let j = 0; j < 14; j++) {
        const scale = 0.55 + (j * 0.08);
        const tiltOffset = -0.3 + (j * 0.08);
        const speed = 0.4 + (j % 4) * 0.22;
        const phaseOffset = (j * 0.85);
        const baseColor = j % 4 === 0 ? '#38BDF8' : j % 4 === 1 ? '#8B5CF6' : j % 4 === 2 ? '#E83E8C' : '#10B981';
        secondaryJourneys.push({
          rx: RADIUS_X * scale,
          ry: RADIUS_Y * scale * 0.88,
          tilt: tiltOffset,
          cx: CENTER_X + (Math.sin(j * 1.3) * WIDTH * 0.08),
          cy: CENTER_Y + (Math.cos(j * 1.1) * HEIGHT * 0.06),
          speed,
          phaseOffset,
          baseColor,
          nodeRadius: 8 + (j % 5) * 4
        });
      }

      // Wave pulses emitted at milestones
      const wavefronts = [];

      function emitWavefront(x, y, color, maxRadius = 380) {
        wavefronts.push({
          x,
          y,
          r: 10,
          maxR: maxRadius,
          color,
          alpha: 1.0,
          growth: 12
        });
      }

      let lastEmittedStage = null;

      // Camera Easing & Transformations
      function getCameraState(t) {
        // Macro Camera Movement:
        // 0s-2s: Close-up macro focus on entering node (zoom 1.55, offset following node)
        // 2s-6s: Floating tracking camera slowly widening (zoom 1.3 -> 1.1)
        // 6s-8s: Mid-shot, transitioning into ecosystem wide (zoom 1.05 -> 0.95)
        // 8s-10s: Epic panoramic macro pull-out revealing entire constellation (zoom 0.92)
        let zoom = 1.0;
        let panX = 0;
        let panY = 0;

        if (t < 2.0) {
          const p = t / 2.0;
          zoom = 1.5 - p * 0.2;
          panX = (1 - p) * (WIDTH * 0.18);
          panY = (1 - p) * (HEIGHT * 0.12);
        } else if (t < 6.0) {
          const p = (t - 2.0) / 4.0;
          zoom = 1.3 - p * 0.2;
          panX = Math.sin(t * 0.8) * 30;
          panY = Math.cos(t * 0.8) * 20;
        } else if (t < 8.2) {
          const p = (t - 6.0) / 2.2;
          zoom = 1.1 - p * 0.12;
          panX = Math.sin(t * 0.6) * 20;
          panY = Math.cos(t * 0.6) * 15;
        } else {
          const p = (t - 8.2) / 1.8;
          zoom = 0.98 - p * 0.08;
          panX = 0;
          panY = 0;
        }

        return { zoom, panX, panY };
      }

      // Color Interpolation Engine
      function hexToRgb(hex) {
        const bigint = parseInt(hex.replace('#', ''), 16);
        return {
          r: (bigint >> 16) & 255,
          g: (bigint >> 8) & 255,
          b: bigint & 255
        };
      }

      function lerpColor(hexA, hexB, amt) {
        const a = hexToRgb(hexA);
        const b = hexToRgb(hexB);
        const r = Math.round(a.r + (b.r - a.r) * amt);
        const g = Math.round(a.g + (b.g - a.g) * amt);
        const bl = Math.round(a.b + (b.b - a.b) * amt);
        return `rgb(${r}, ${g}, ${bl})`;
      }

      function getPrimaryNodeProperties(t) {
        // Compute position along entry + circular orbit
        let currentPos = { x: 0, y: 0 };
        let nodeColor = '#38BDF8';
        let nodeRadius = 24;
        let auraIntensity = 1.0;
        let stageIndex = 0;

        if (t < 1.8) {
          // Entrance phase: smoothly flies into orbit
          const progress = t / 1.8;
          // Ease-out cubic
          const ease = 1 - Math.pow(1 - progress, 3);
          const startX = WIDTH * 0.08;
          const startY = HEIGHT * 0.15;
          const orbitStart = getOrbitPoint(START_ANGLE);
          currentPos.x = startX + (orbitStart.x - startX) * ease;
          currentPos.y = startY + (orbitStart.y - startY) * ease;
          nodeColor = lerpColor('#38BDF8', '#3F51C9', progress);
          nodeRadius = 22 + progress * 6;
          stageIndex = 0;
        } else {
          const orbitProgress = (t - 1.8) / (DURATION - 1.8);
          const angle = START_ANGLE + orbitProgress * TOTAL_TRAVEL_RADIANS;
          currentPos = getOrbitPoint(angle);

          if (t < 4.0) {
            stageIndex = 1;
            const p = (t - 1.8) / (4.0 - 1.8);
            nodeColor = lerpColor('#3F51C9', '#8B5CF6', p);
            nodeRadius = 28 + p * 8;
            auraIntensity = 1.2;
          } else if (t < 6.2) {
            stageIndex = 2;
            const p = (t - 4.0) / (6.2 - 4.0);
            nodeColor = lerpColor('#8B5CF6', '#E83E8C', p);
            nodeRadius = 36 + p * 10;
            auraIntensity = 1.5;
          } else if (t < 8.2) {
            stageIndex = 3;
            const p = (t - 6.2) / (8.2 - 6.2);
            nodeColor = lerpColor('#E83E8C', '#10B981', p);
            nodeRadius = 46 + p * 12;
            auraIntensity = 1.8;
          } else {
            stageIndex = 4;
            const p = (t - 8.2) / (10.0 - 8.2);
            nodeColor = lerpColor('#10B981', '#34D399', p);
            nodeRadius = 58 + Math.sin(t * 8) * 4;
            auraIntensity = 2.4;
          }
        }

        return {
          pos: currentPos,
          color: nodeColor,
          radius: nodeRadius,
          aura: auraIntensity,
          stage: STAGES[stageIndex]
        };
      }

      // Main Render Loop
      function render(now) {
        const delta = (now - lastTimestamp) / 1000;
        lastTimestamp = now;

        if (isPlaying) {
          currentTime += delta * playbackSpeed;
          if (currentTime >= DURATION) {
            currentTime = 0.0;
            particleTrail.length = 0;
            wavefronts.length = 0;
          }
        }

        // Camera State
        const camera = getCameraState(currentTime);
        const hero = getPrimaryNodeProperties(currentTime);

        // Emit wavefront pulse on stage transition
        if (hero.stage.id !== lastEmittedStage) {
          emitWavefront(hero.pos.x, hero.pos.y, hero.color, 450);
          lastEmittedStage = hero.stage.id;
        }

        // Push to hero trail
        particleTrail.unshift({
          x: hero.pos.x,
          y: hero.pos.y,
          color: hero.color,
          radius: hero.radius * 0.45,
          alpha: 1.0,
          timestamp: currentTime
        });
        if (particleTrail.length > MAX_TRAIL) {
          particleTrail.pop();
        }

        // Clear Canvas with Deep Navy Luxury Gradient
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        // Deep Navy Gradient Layer
        const bgGrad = ctx.createRadialGradient(
          CENTER_X, CENTER_Y, 200,
          CENTER_X, CENTER_Y, WIDTH * 0.85
        );
        bgGrad.addColorStop(0, '#090F2C');
        bgGrad.addColorStop(0.35, '#060B20');
        bgGrad.addColorStop(0.7, '#040714');
        bgGrad.addColorStop(1, '#020308');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // Ambient Nebula Glows (Royal Purple & Electric Blue)
        ctx.globalCompositeOperation = 'screen';
        const nebula1 = ctx.createRadialGradient(
          WIDTH * 0.35, HEIGHT * 0.4, 80,
          WIDTH * 0.35, HEIGHT * 0.4, 1100
        );
        nebula1.addColorStop(0, 'rgba(108, 43, 217, 0.18)');
        nebula1.addColorStop(0.6, 'rgba(63, 81, 201, 0.08)');
        nebula1.addColorStop(1, 'transparent');
        ctx.fillStyle = nebula1;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const nebula2 = ctx.createRadialGradient(
          WIDTH * 0.68, HEIGHT * 0.55, 100,
          WIDTH * 0.68, HEIGHT * 0.55, 1200
        );
        nebula2.addColorStop(0, 'rgba(232, 62, 140, 0.14)');
        nebula2.addColorStop(0.5, 'rgba(16, 185, 129, 0.08)');
        nebula2.addColorStop(1, 'transparent');
        ctx.fillStyle = nebula2;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // Background Micro Stardust Particles
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < bgCosmicParticles.length; i++) {
          const p = bgCosmicParticles[i];
          const pulse = Math.sin(currentTime * 2 + p.phase);
          const alpha = p.alpha * (0.6 + 0.4 * pulse);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = alpha;
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // Apply Macro Camera Zoom & Panning
        ctx.save();
        ctx.translate(CENTER_X, CENTER_Y);
        ctx.scale(camera.zoom, camera.zoom);
        ctx.translate(-CENTER_X + camera.panX, -CENTER_Y + camera.panY);

        // Draw Expanding Wavefronts
        ctx.globalCompositeOperation = 'lighter';
        for (let w = wavefronts.length - 1; w >= 0; w--) {
          const wave = wavefronts[w];
          wave.r += wave.growth;
          wave.alpha = Math.max(0, 1.0 - (wave.r / wave.maxR));

          if (wave.alpha <= 0) {
            wavefronts.splice(w, 1);
            continue;
          }

          ctx.beginPath();
          ctx.arc(wave.x, wave.y, wave.r, 0, Math.PI * 2);
          ctx.strokeStyle = wave.color;
          ctx.lineWidth = 4 * wave.alpha;
          ctx.globalAlpha = wave.alpha * 0.65;
          ctx.stroke();

          // Subtle harmonic second ring
          ctx.beginPath();
          ctx.arc(wave.x, wave.y, wave.r * 0.75, 0, Math.PI * 2);
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 1.5 * wave.alpha;
          ctx.globalAlpha = wave.alpha * 0.4;
          ctx.stroke();
        }
        ctx.globalAlpha = 1.0;

        // Draw Interconnected Customer Journeys (Constellation)
        // Multiplies in visibility as time approaches second 8.0-10.0
        const ecosystemIntensity = Math.min(1.0, Math.max(0.0, (currentTime - 3.5) / 5.5));

        if (ecosystemIntensity > 0.01) {
          ctx.globalCompositeOperation = 'lighter';

          for (let j = 0; j < secondaryJourneys.length; j++) {
            const sj = secondaryJourneys[j];
            const orbitAlpha = 0.18 * ecosystemIntensity;

            // Secondary Elliptical Luminous Curve
            ctx.beginPath();
            const steps = 60;
            for (let s = 0; s <= steps; s++) {
              const ang = (s / steps) * Math.PI * 2;
              const pt = getOrbitPoint(ang, sj.rx, sj.ry, sj.cx, sj.cy, sj.tilt);
              if (s === 0) ctx.moveTo(pt.x, pt.y);
              else ctx.lineTo(pt.x, pt.y);
            }
            ctx.closePath();
            ctx.strokeStyle = sj.baseColor;
            ctx.lineWidth = 2.0 * ecosystemIntensity;
            ctx.globalAlpha = orbitAlpha;
            ctx.stroke();

            // Luminous secondary traveler nodes moving along these orbits
            const nodeAng = (currentTime * sj.speed) + sj.phaseOffset;
            const nodePt = getOrbitPoint(nodeAng, sj.rx, sj.ry, sj.cx, sj.cy, sj.tilt);

            // Glow aura
            const secGlow = ctx.createRadialGradient(
              nodePt.x, nodePt.y, 2,
              nodePt.x, nodePt.y, sj.nodeRadius * 4.5
            );
            secGlow.addColorStop(0, '#FFFFFF');
            secGlow.addColorStop(0.3, sj.baseColor);
            secGlow.addColorStop(1, 'transparent');
            ctx.fillStyle = secGlow;
            ctx.globalAlpha = 0.75 * ecosystemIntensity;
            ctx.beginPath();
            ctx.arc(nodePt.x, nodePt.y, sj.nodeRadius * 4.5, 0, Math.PI * 2);
            ctx.fill();

            // Core dot
            ctx.fillStyle = '#FFFFFF';
            ctx.globalAlpha = 0.9 * ecosystemIntensity;
            ctx.beginPath();
            ctx.arc(nodePt.x, nodePt.y, sj.nodeRadius * 0.8, 0, Math.PI * 2);
            ctx.fill();

            // Thin luminous chord linking secondary node to primary hero node if within range
            const dist = Math.hypot(hero.pos.x - nodePt.x, hero.pos.y - nodePt.y);
            if (dist < 850 && ecosystemIntensity > 0.4) {
              const chordAlpha = (1 - (dist / 850)) * 0.45 * ecosystemIntensity;
              ctx.beginPath();
              ctx.moveTo(hero.pos.x, hero.pos.y);
              ctx.lineTo(nodePt.x, nodePt.y);
              ctx.strokeStyle = sj.baseColor;
              ctx.lineWidth = 1.8;
              ctx.globalAlpha = chordAlpha;
              ctx.stroke();
            }
          }
          ctx.globalAlpha = 1.0;
        }

        // Draw The Primary Master Lifecycle Orbital Curve
        ctx.globalCompositeOperation = 'lighter';
        // Base track glow
        ctx.beginPath();
        const mainSteps = 120;
        for (let m = 0; m <= mainSteps; m++) {
          const ang = (m / mainSteps) * Math.PI * 2;
          const pt = getOrbitPoint(ang);
          if (m === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.closePath();
        ctx.strokeStyle = 'rgba(63, 81, 201, 0.25)';
        ctx.lineWidth = 3.0;
        ctx.stroke();

        // Active Lit Curve (illuminates as hero node advances)
        const travelProgress = Math.min(1.0, Math.max(0.0, (currentTime - 1.8) / (DURATION - 1.8)));
        if (travelProgress > 0) {
          ctx.beginPath();
          const litSteps = Math.floor(mainSteps * travelProgress);
          for (let l = 0; l <= litSteps; l++) {
            const ang = START_ANGLE + (l / mainSteps) * TOTAL_TRAVEL_RADIANS;
            const pt = getOrbitPoint(ang);
            if (l === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          }
          const activeGrad = ctx.createLinearGradient(
            WIDTH * 0.2, HEIGHT * 0.2,
            WIDTH * 0.8, HEIGHT * 0.8
          );
          activeGrad.addColorStop(0, '#38BDF8');
          activeGrad.addColorStop(0.35, '#8B5CF6');
          activeGrad.addColorStop(0.7, '#E83E8C');
          activeGrad.addColorStop(1, '#10B981');
          ctx.strokeStyle = activeGrad;
          ctx.lineWidth = 6.0;
          ctx.shadowColor = hero.color;
          ctx.shadowBlur = 25;
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        // Draw Entrance Curve (t < 2.0s)
        if (currentTime < 2.5) {
          const entAlpha = Math.max(0, 1.0 - (currentTime / 2.5));
          const startX = WIDTH * 0.08;
          const startY = HEIGHT * 0.15;
          const orbitStart = getOrbitPoint(START_ANGLE);
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.quadraticCurveTo(WIDTH * 0.15, HEIGHT * 0.45, orbitStart.x, orbitStart.y);
          ctx.strokeStyle = '#38BDF8';
          ctx.lineWidth = 4.0;
          ctx.globalAlpha = entAlpha * 0.6;
          ctx.stroke();
          ctx.globalAlpha = 1.0;
        }

        // Draw 5 Milestone Anchor Nodes along the Lifecycle Circle
        const milestoneAngles = [
          { name: 'NEW', ang: START_ANGLE, color: '#38BDF8' },
          { name: 'ACTIVE', ang: START_ANGLE + (0.28 * TOTAL_TRAVEL_RADIANS), color: '#8B5CF6' },
          { name: 'SUBSCRIBED', ang: START_ANGLE + (0.55 * TOTAL_TRAVEL_RADIANS), color: '#E83E8C' },
          { name: 'RENEWING', ang: START_ANGLE + (0.78 * TOTAL_TRAVEL_RADIANS), color: '#10B981' },
          { name: 'GROWING', ang: START_ANGLE + (0.98 * TOTAL_TRAVEL_RADIANS), color: '#34D399' }
        ];

        for (let k = 0; k < milestoneAngles.length; k++) {
          const ms = milestoneAngles[k];
          const pt = getOrbitPoint(ms.ang);
          const isPassed = travelProgress >= (k / (milestoneAngles.length - 1));

          // Outer halo ring
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, isPassed ? 16 : 10, 0, Math.PI * 2);
          ctx.strokeStyle = ms.color;
          ctx.lineWidth = isPassed ? 2.5 : 1.5;
          ctx.globalAlpha = isPassed ? 0.85 : 0.35;
          ctx.stroke();

          // Inner solid core
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, isPassed ? 7 : 4, 0, Math.PI * 2);
          ctx.fillStyle = isPassed ? ms.color : 'rgba(255,255,255,0.4)';
          ctx.globalAlpha = isPassed ? 0.95 : 0.4;
          ctx.fill();

          // Minimalist Luxury Stage Typography in World Space
          ctx.font = '600 24px "Plus Jakarta Sans", sans-serif';
          ctx.fillStyle = isPassed ? '#FFFFFF' : 'rgba(255, 255, 255, 0.45)';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.letterSpacing = '4px';

          // Position text neatly outside orbit
          const labelDist = 58;
          const angleToCenter = Math.atan2(pt.y - CENTER_Y, pt.x - CENTER_X);
          const labelX = pt.x + Math.cos(angleToCenter) * labelDist;
          const labelY = pt.y + Math.sin(angleToCenter) * labelDist;
          ctx.fillText(ms.name, labelX, labelY);
        }
        ctx.globalAlpha = 1.0;

        // Draw Luminous Particle Ribbon Trail
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < particleTrail.length - 1; i++) {
          const p1 = particleTrail[i];
          const p2 = particleTrail[i + 1];
          const trailAlpha = (1 - (i / particleTrail.length)) * 0.85;

          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = p1.color;
          ctx.lineWidth = p1.radius * (1 - (i / particleTrail.length));
          ctx.globalAlpha = trailAlpha;
          ctx.stroke();
        }
        ctx.globalAlpha = 1.0;

        // Draw Hero Customer Node (Realistic Glass / Light Specular Core)
        const hx = hero.pos.x;
        const hy = hero.pos.y;
        const hr = hero.radius;

        // 1. Broad Anamorphic Horizontal Lens Flare
        ctx.globalCompositeOperation = 'lighter';
        const flareWidth = hr * 14 * hero.aura;
        const flareHeight = hr * 1.6;
        const flareGrad = ctx.createRadialGradient(
          hx, hy, 2,
          hx, hy, flareWidth * 0.5
        );
        flareGrad.addColorStop(0, '#FFFFFF');
        flareGrad.addColorStop(0.15, hero.color);
        flareGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.15)');
        flareGrad.addColorStop(1, 'transparent');

        ctx.save();
        ctx.translate(hx, hy);
        ctx.scale(1, flareHeight / flareWidth);
        ctx.beginPath();
        ctx.arc(0, 0, flareWidth * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = flareGrad;
        ctx.globalAlpha = 0.9;
        ctx.fill();
        ctx.restore();

        // 2. Multi-Layer Outer Volumetric Bloom
        const bloomGrad = ctx.createRadialGradient(
          hx, hy, hr * 0.2,
          hx, hy, hr * 5.2
        );
        bloomGrad.addColorStop(0, '#FFFFFF');
        bloomGrad.addColorStop(0.2, hero.color);
        bloomGrad.addColorStop(0.5, hero.color);
        bloomGrad.addColorStop(0.8, 'rgba(0,0,0,0)');
        bloomGrad.addColorStop(1, 'transparent');

        ctx.beginPath();
        ctx.arc(hx, hy, hr * 5.2, 0, Math.PI * 2);
        ctx.fillStyle = bloomGrad;
        ctx.globalAlpha = 0.65 * hero.aura;
        ctx.fill();

        // 3. Realistic Glass Refraction Sphere & Specular Core
        const glassGrad = ctx.createRadialGradient(
          hx - hr * 0.35, hy - hr * 0.35, hr * 0.1,
          hx, hy, hr
        );
        glassGrad.addColorStop(0, '#FFFFFF');
        glassGrad.addColorStop(0.3, '#FFFFFF');
        glassGrad.addColorStop(0.7, hero.color);
        glassGrad.addColorStop(1, 'rgba(10, 15, 40, 0.8)');

        ctx.beginPath();
        ctx.arc(hx, hy, hr, 0, Math.PI * 2);
        ctx.fillStyle = glassGrad;
        ctx.globalAlpha = 1.0;
        ctx.fill();

        // 4. Ethereal Glass Specular Arc & Highlights
        ctx.beginPath();
        ctx.arc(hx, hy, hr * 0.9, -Math.PI * 0.75, -Math.PI * 0.1);
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 3.5;
        ctx.stroke();

        // 5. Orbiting Satellites (Energy Sparks around Customer Node)
        for (let s = 0; s < 3; s++) {
          const satAngle = currentTime * 4.5 + (s * (Math.PI * 2 / 3));
          const satDist = hr * 1.55;
          const sx = hx + Math.cos(satAngle) * satDist;
          const sy = hy + Math.sin(satAngle) * satDist * 0.65;

          ctx.beginPath();
          ctx.arc(sx, sy, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = '#FFFFFF';
          ctx.shadowColor = hero.color;
          ctx.shadowBlur = 15;
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        ctx.restore(); // Restore Camera Transform
        ctx.restore(); // Restore Base Canvas

        // Update DOM HUD Displays
        updateHud(hero, currentTime);

        requestAnimationFrame(render);
      }

      function updateHud(hero, t) {
        // Time Display
        const seconds = Math.floor(t);
        const centis = Math.floor((t % 1) * 100);
        const timeStr = `00:${seconds.toString().padStart(2, '0')}.${centis.toString().padStart(2, '0')} / 00:10.00`;
        timeDisplay.textContent = timeStr;

        // Progress Bar
        const progressPct = (t / DURATION) * 100;
        timelineProgress.style.width = `${progressPct}%`;

        // Stage HUD
        stageNum.textContent = hero.stage.num;
        stagePhase.textContent = `PHASE ${hero.stage.num} · VALUE ${hero.stage.val}`;
        stageName.textContent = hero.stage.label;
        stageName.style.color = hero.stage.color;
        stageMeta.textContent = hero.stage.meta;
        stageNum.style.borderColor = hero.stage.color;
        stageNum.style.color = hero.stage.color;
      }

      // Timeline Scrubber Click & Drag
      timelineWrapper.addEventListener('click', (e) => {
        const rect = timelineWrapper.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        currentTime = ratio * DURATION;
        particleTrail.length = 0;
        wavefronts.length = 0;
      });

      // Play / Pause Toggle
      playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
          playText.textContent = 'Pause';
          playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
          lastTimestamp = performance.now();
        } else {
          playText.textContent = 'Play';
          playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
      });

      // Restart / Replay
      restartBtn.addEventListener('click', () => {
        currentTime = 0.0;
        particleTrail.length = 0;
        wavefronts.length = 0;
        if (!isPlaying) {
          isPlaying = true;
          playText.textContent = 'Pause';
          playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
          lastTimestamp = performance.now();
        }
      });

      // Speed Buttons
      speedBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          speedBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          playbackSpeed = parseFloat(btn.getAttribute('data-speed'));
        });
      });

      // Fullscreen Toggle
      fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          container.requestFullscreen().catch(err => {
            console.error(err);
          });
        } else {
          document.exitFullscreen();
        }
      });

      // Start Cinema Engine
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
