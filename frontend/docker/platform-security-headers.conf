# Response headers for the Rooman platform (staff / Super Admin) console at /superadmin and the
# platform API - stricter than the tenant set (docker/security-headers.conf, which is unchanged).
# The console loads nothing from third parties: no payment scripts, no web fonts, and it can never
# be framed. It may frame only its own origin: the visual editor's preview (/superadmin/ui-preview,
# docker/platform-preview-security-headers.conf). Included per location (nginx does not inherit add_header into locations that
# declare their own).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), clipboard-read=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# same-origin-allow-popups: the console opens the tenant workspace tab (/platform-access, same origin)
# and hands it the grant token by postMessage; other sites cannot keep a reference to the console.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Strict-Transport-Security $hsts_header always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; frame-src 'self'; object-src 'none'; manifest-src 'none'; worker-src 'none'" always;
