# Rooman platform (staff) console - nginx site config for the platform web container.
# Installed as /etc/nginx/conf.d/default.conf by frontend/Dockerfile.platform.
# Serves ONLY the platform console bundle and proxies ONLY /api/v1/platform/ to the backend.
# The tenant SPA, tenant API, uploads and webhooks are not reachable through this server.
# See docs/platform-console-deployment.md.

map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    "https" "https";
    "http"  "http";
}

map $forwarded_scheme $hsts_header {
    default "";
    "https" "max-age=31536000; includeSubDomains";
}

# Same real-client-address handling as the tenant server (docker/nginx.conf): trust X-Real-IP only
# from private-network peers (Caddy on the compose network), overwrite it towards the backend.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1/32;
set_real_ip_from ::1/128;
set_real_ip_from fc00::/7;
real_ip_header X-Real-IP;
real_ip_recursive off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index platform.html;

    client_max_body_size 64k;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "http://backend:8000";

    # ---- Platform API only ----------------------------------------------------------------------
    # The Host header is passed through unchanged: the backend answers platform requests only when
    # Host is the PLATFORM_APP_ORIGIN host, and refuses every non-platform path on that host.
    location /api/v1/platform/ {
        include /etc/nginx/snippets/platform-security-headers.conf;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        add_header Cache-Control "no-store" always;
    }

    # Any other API path (tenant API, uploads, webhooks) does not exist on this origin.
    location /api/ {
        include /etc/nginx/snippets/platform-security-headers.conf;
        return 404;
    }
    location ^~ /uploads/ {
        include /etc/nginx/snippets/platform-security-headers.conf;
        return 404;
    }

    location /assets/ {
        include /etc/nginx/snippets/platform-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /platform.html {
        include /etc/nginx/snippets/platform-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        include /etc/nginx/snippets/platform-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /platform.html;
    }
}
