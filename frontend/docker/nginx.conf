# Rooman Billing - nginx site config for the web container: the ONE public website.
# Installed as /etc/nginx/conf.d/default.conf (see frontend/Dockerfile).
#
#   /                 -> tenant SPA (index.html) with history-API fallback; /admin is its sign-in
#   /superadmin[/...] -> platform (Rooman staff / Super Admin) console document (superadmin.html),
#                        with the stricter console headers (snippets/platform-security-headers.conf)
#   /assets/          -> hashed Vite bundles (both entries), cached for a year
#   /api/v1/platform/ -> platform API (console headers, small bodies; the API itself enforces the
#                        platform session, 2FA, CSRF and the Origin / Sec-Fetch-Site boundary)
#   /api/             -> reverse proxy to the FastAPI container (compose service "backend")
#   /healthz          -> container liveness (200 "ok")

# Preserve the scheme reported by the TLS terminator (Caddy/Traefik/ALB) in front
# of this container; fall back to our own scheme when none is present.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    "https" "https";
    "http"  "http";
}

# HSTS is only meaningful over TLS. Emit it when the request arrived over https
# (directly or via the TLS terminator in front); an empty value makes nginx skip
# the add_header entirely, so plain-http health checks are unaffected.
map $forwarded_scheme $hsts_header {
    default "";
    "https" "max-age=31536000; includeSubDomains";
}

# ---- Real client address ------------------------------------------------------
# The API rate-limits and throttles sign-ins by client IP and reads it ONLY from the
# X-Real-IP header we set below (backend/app/api/deps.py:client_ip); it ignores
# X-Forwarded-For, whose leftmost entry is client-controlled.
#
# nginx is either the edge (FRONTEND_BIND=80) or sits behind Caddy (docker-compose.caddy.yml),
# which overwrites X-Real-IP with its own TCP peer. The realip module below trusts that header
# only from private-network peers (Caddy / a host proxy on the docker network), so:
#   - behind Caddy:  $remote_addr becomes the visitor address Caddy saw;
#   - at the edge:   internet peers are not trusted, $remote_addr stays the TCP peer and any
#                    X-Real-IP a client sends is discarded.
# If you put a different proxy in front, make sure it OVERWRITES X-Real-IP (never appends).
# Caveat: when nginx is the edge and Docker's userland-proxy forwards the published port
# (e.g. IPv6 clients), peers appear as the docker gateway (172.x) and would be trusted -
# run Caddy in front (recommended) or disable userland-proxy in that setup.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1/32;
set_real_ip_from ::1/128;
set_real_ip_from fc00::/7;
real_ip_header X-Real-IP;
real_ip_recursive off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # CSV imports are capped at 5 MB by the API; leave headroom for multipart overhead.
    client_max_body_size 10m;

    # Hide the version banner.
    server_tokens off;

    # ---- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript application/json
        application/xml application/xml+rss application/manifest+json
        image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # ---- Liveness -----------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API reverse proxy ---------------------------------------------------
    # Docker's embedded DNS. Resolving through a variable means nginx starts even
    # if the backend is not up yet and follows a restarted backend's new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "http://backend:8000";

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;

        # With a variable in proxy_pass the request URI is forwarded unchanged,
        # so /api/v1/... reaches the backend as /api/v1/...
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # $remote_addr is already the resolved client (see realip above). Both headers are
        # overwritten, never appended, so nothing a client sends reaches the API.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # PDF rendering and gateway calls can take a moment; gunicorn --timeout is 60s.
        proxy_connect_timeout 10s;
        proxy_send_timeout    65s;
        proxy_read_timeout    65s;

        # Never cache API responses at this layer.
        add_header Cache-Control "no-store" always;
    }

    # ---- Platform (Super Admin) API ------------------------------------------
    # Same backend, same origin; only the response headers and body limits differ from /api/.
    location ^~ /api/v1/platform/ {
        include /etc/nginx/snippets/platform-security-headers.conf;
        client_max_body_size 64k;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        add_header Cache-Control "no-store" always;
    }

    # Website CMS media uploads (Platform Administrator only, validated by the API): the one
    # platform route that accepts a larger body.
    location = /api/v1/platform/website/assets {
        include /etc/nginx/snippets/platform-security-headers.conf;
        client_max_body_size 32m;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        add_header Cache-Control "no-store" always;
    }

    # ---- Uploads reverse proxy ----------------------------------------------
    location ^~ /uploads/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # $remote_addr is already the resolved client (see realip above). Both headers are
        # overwritten, never appended, so nothing a client sends reaches the API.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    65s;
        proxy_read_timeout    65s;
    }

    # ---- Hashed build assets: immutable, cache for a year -------------------------
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Favicons / logos from public/ are not content-hashed; cache for a week.
    location ~* \.(png|svg|ico|jpg|jpeg|webp|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # ---- Platform (Super Admin) console: /superadmin and every /superadmin/... route ----
    # Always the console document, never the tenant index.html, with the stricter console header
    # set (no third-party scripts/fonts/frames, not framable, not indexed). ^~ keeps the static
    # file regex below from matching here.
    location = /superadmin {
        include /etc/nginx/snippets/platform-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /superadmin.html =404;
    }
    # The visual editor's preview frame: framable by this origin only (see the snippet).
    location = /superadmin/ui-preview {
        include /etc/nginx/snippets/platform-preview-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /superadmin.html =404;
    }
    location ^~ /superadmin/ {
        include /etc/nginx/snippets/platform-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /superadmin.html =404;
    }
    location = /superadmin.html {
        include /etc/nginx/snippets/platform-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ---- SPA entrypoint: always revalidate so deploys are picked up ---------------
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---- Everything else is a client-side route --------------------------------------
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
