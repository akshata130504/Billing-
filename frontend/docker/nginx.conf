# Rooman Billing - nginx site config for the web container.
# Installed as /etc/nginx/conf.d/default.conf (see frontend/Dockerfile).
#
#   /            -> static SPA build with history-API fallback
#   /assets/     -> hashed Vite bundles, cached for a year
#   /api/        -> reverse proxy to the FastAPI container (compose service "backend")
#   /healthz     -> container liveness (200 "ok")

# Preserve the scheme reported by the TLS terminator (Caddy/Traefik/ALB) in front
# of this container; fall back to our own scheme when none is present.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    "https" "https";
    "http"  "http";
}

# HSTS is only meaningful over TLS. Emit it when the request arrived over https
# (directly or via the TLS terminator in front); an empty value makes nginx skip
# the add_header entirely, so plain-http health checks are unaffected.
map $forwarded_scheme $hsts_header {
    default "";
    "https" "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # CSV imports are capped at 5 MB by the API; leave headroom for multipart overhead.
    client_max_body_size 10m;

    # Hide the version banner.
    server_tokens off;

    # ---- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript application/json
        application/xml application/xml+rss application/manifest+json
        image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # ---- Liveness -----------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API reverse proxy ---------------------------------------------------
    # Docker's embedded DNS. Resolving through a variable means nginx starts even
    # if the backend is not up yet and follows a restarted backend's new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "http://backend:8000";

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;

        # With a variable in proxy_pass the request URI is forwarded unchanged,
        # so /api/v1/... reaches the backend as /api/v1/...
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # PDF rendering and gateway calls can take a moment; gunicorn --timeout is 60s.
        proxy_connect_timeout 10s;
        proxy_send_timeout    65s;
        proxy_read_timeout    65s;

        # Never cache API responses at this layer.
        add_header Cache-Control "no-store" always;
    }

    # ---- Uploads reverse proxy ----------------------------------------------
    location ^~ /uploads/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    65s;
        proxy_read_timeout    65s;
    }

    # ---- Hashed build assets: immutable, cache for a year -------------------------
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Favicons / logos from public/ are not content-hashed; cache for a week.
    location ~* \.(png|svg|ico|jpg|jpeg|webp|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # ---- SPA entrypoint: always revalidate so deploys are picked up ---------------
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---- Everything else is a client-side route --------------------------------------
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
