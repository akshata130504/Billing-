# Headers for /superadmin/ui-preview ONLY: the visual editor's preview frame. Identical to the
# console set (docker/platform-security-headers.conf) except that it may be framed by its own origin
# (the console's editor) - never by another site - and frames nothing itself. The page renders
# tenant components with built-in sample data and refuses every write; it has no tenant session.
# connect-src/form-action 'none': the preview answers every request from built-in sample data, so
# the browser itself refuses any network request or form post from this page (defence in depth).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), clipboard-read=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# same-origin-allow-popups: the console opens the tenant workspace tab (/platform-access, same origin)
# and hands it the grant token by postMessage; other sites cannot keep a reference to the console.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Strict-Transport-Security $hsts_header always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; frame-src 'none'; object-src 'none'; manifest-src 'none'; worker-src 'none'" always;
