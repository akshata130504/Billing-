# Proxied API responses: nginx's own security-header snippet is the single source of these
# headers. The backend sets the same names as a fallback for direct access, so drop its
# copies here; otherwise browsers receive every header twice, with conflicting values
# (e.g. X-Frame-Options DENY and SAMEORIGIN). Cache-Control is set by each location.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-Permitted-Cross-Domain-Policies;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Cache-Control;
