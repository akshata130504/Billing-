# Shared response headers. Included in every location because nginx's add_header
# directives are NOT inherited once a location declares its own add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# HSTS is only meaningful over TLS. Enable it at the TLS terminator (Caddy example
# in docs/deployment.md) or uncomment here once the site is served only over HTTPS.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# A Content-Security-Policy is deliberately not enforced by default: the hosted
# payment page loads Razorpay Checkout (checkout.razorpay.com) and the app loads
# fonts from Google. Starting point if you want to enable one:
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
