# Shared response headers. Included in every location because nginx's add_header
# directives are NOT inherited once a location declares its own add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# HSTS. $hsts_header is set by the map in nginx.conf: non-empty only when the
# request reached us over https, so nginx omits the header on plain http.
add_header Strict-Transport-Security $hsts_header always;

# ---- Content-Security-Policy -------------------------------------------------
# Enforced. Read this before tightening it - the hosted payment page WILL break
# if Razorpay is removed:
#   script-src   checkout.razorpay.com serves Checkout.js.
#   frame-src    Razorpay opens its payment modal in an iframe on api.razorpay.com
#                (and rzp popups on checkout.razorpay.com); 3-D Secure bank pages
#                are redirected inside it, hence the https: fallback.
#   connect-src  Checkout.js calls api.razorpay.com and posts telemetry to
#                lumberjack.razorpay.com. 'self' covers our own /api/ (the SPA is
#                same-origin with the API through this same nginx). If you ever move
#                the API to another origin, add it here.
#   style-src    'unsafe-inline' is required: Razorpay injects inline styles, and so
#                does the SPA for a handful of dynamic widths.
#   img-src      https: + data: covers org logos, QR codes and gateway assets.
# frame-ancestors is the modern equivalent of X-Frame-Options (both are sent).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com https://lumberjack-cx.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https:; form-action 'self' https://api.razorpay.com; frame-ancestors 'self'; manifest-src 'self'; worker-src 'self' blob:" always;
