# Rooman Billing - production stack.
#
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Services
#   db         PostgreSQL 16 with a named volume (not published to the host). POSTGRES_USER is
#              the bootstrap superuser / schema owner; optionally the app runs as a separate
#              DML-only role (APP_POSTGRES_USER, see deploy/db-least-privilege.sh).
#   backend    FastAPI via gunicorn/uvicorn; runs migrations on start; SCHEDULER_ENABLED=false
#   scheduler  same image, one instance, SCHEDULER_ENABLED=true - runs renewals /
#              trial conversion / overdue marking / dunning. REQUIRED: nothing else runs them.
#   frontend   nginx serving the ONE Rooman Billing website and proxying /api/ to backend:8000
#              (port 80): the tenant app at /admin and the Rooman staff (platform / Super Admin)
#              console at /superadmin, both on the origin of FRONTEND_URL. There is no separate
#              platform domain or container; the console keeps its own sign-in, 2FA and headers.
#   backup     nightly pg_dump + uploads tarball, optional rclone offsite copy and
#              webhook alert on failure (script: deploy/backup.sh)
#
# Images are deployed by immutable git-SHA tag: deploy/deploy-poll.sh exports
# IMAGE_TAG=<sha> (see .deploy/deployed_sha on the host). For a manual command use
#   IMAGE_TAG=$(cat .deploy/deployed_sha) docker compose --env-file .env.production -f docker-compose.prod.yml ...
#
# Resource limits are sized for a small (2 vCPU / 4 GB) VM and can be overridden
# per service from .env.production (e.g. BACKEND_MEM_LIMIT=2g, BACKEND_CPUS=2).
#
# TLS: terminate HTTPS in front of `frontend` (see docker-compose.caddy.yml and
# docs/deployment.md). Set FRONTEND_BIND=127.0.0.1:8080 in .env.production when a
# reverse proxy on the host or the caddy overlay owns ports 80/443.

name: rooman-billing

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Only what Postgres needs - NOT the whole .env.production (API secrets, Razorpay
    # keys, SMTP passwords... have no business in the database container).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Deliberately no `ports:` - only containers on the compose network reach the DB.
    # For an admin session use: docker compose -f docker-compose.prod.yml exec db psql -U $POSTGRES_USER $POSTGRES_DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 256m
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-1.0}
    logging: &default-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Deliberately no published ports: only internal containers on the compose network reach Redis.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    cpus: ${REDIS_CPUS:-0.5}
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Pulled from GHCR by deploy/deploy-poll.sh in normal operation; `build:` above is
    # kept so `docker compose up -d --build` still works for a manual/local rebuild.
    image: ghcr.io/rooman-itsd/rooman-billing-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      # The API replicas never run background jobs; the `scheduler` service does.
      SCHEDULER_ENABLED: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RUN_MIGRATIONS: "true"
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      # Least privilege (REQUIRED, docs/database-security.md): the API connects as the DML-only
      # APP_POSTGRES_USER role while the entrypoint's Alembic step runs as the owner
      # (POSTGRES_USER). The entrypoint unsets MIGRATION_* before gunicorn starts. The app
      # refuses to start in production as a SUPERUSER/BYPASSRLS role (RLS would be ignored).
      POSTGRES_USER: ${APP_POSTGRES_USER:?set APP_POSTGRES_USER (least-privilege runtime role, deploy/db-least-privilege.sh) in .env.production}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?set APP_POSTGRES_PASSWORD in .env.production}
      MIGRATION_POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      MIGRATION_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Platform (staff) console sign-in at /superadmin on the FRONTEND_URL origin. Required so a
      # release always ships a working console; the API accepts /api/v1/platform/* only from that
      # origin (core/platform_boundary.py).
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set PLATFORM_JWT_SECRET (openssl rand -hex 32) in .env.production}
    volumes:
      - uploads_data:/app/backend/uploads
      # Expense receipts - private (never served by nginx), see expense_service._receipt_root.
      - private_uploads_data:/app/backend/private_uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Not published: the frontend container proxies /api/. Uncomment for local debugging only.
    # ports:
    #   - "127.0.0.1:8000:8000"
    # Liveness only: /api/v1/health is a SELECT 1 and always returns 200. The deep probe
    # GET /api/v1/health/ready returns 503 while migrations are behind - use that one for a
    # load balancer or a deploy gate, not here (it would flap during the migration step).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    cpus: ${BACKEND_CPUS:-1.0}
    logging: *default-logging

  scheduler:
    image: ghcr.io/rooman-itsd/rooman-billing-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      # REQUIRED. Without exactly one process running with this enabled, subscription
      # renewals, trial conversion, overdue marking and dunning silently never happen.
      # Never set it to "true" on `backend` as well: that produces duplicate invoices.
      SCHEDULER_ENABLED: "true"
      RUN_MIGRATIONS: "false"      # backend already migrated; avoid two migrators racing
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      # Runtime role only (see backend); the scheduler never needs the owner credentials.
      POSTGRES_USER: ${APP_POSTGRES_USER:?set APP_POSTGRES_USER (least-privilege runtime role, deploy/db-least-privilege.sh) in .env.production}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?set APP_POSTGRES_PASSWORD in .env.production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - uploads_data:/app/backend/uploads
      # Expense receipts - private (never served by nginx), see expense_service._receipt_root.
      - private_uploads_data:/app/backend/private_uploads
    # Exactly ONE instance of this service may run. `run_forever` is provided by
    # backend/app/services/scheduler.py and blocks while APScheduler runs the jobs.
    command: ["python", "-c", "from backend.app.services.scheduler import run_forever; run_forever()"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
    # The scheduler serves no HTTP port (the image's default HEALTHCHECK probes :8000),
    # so check its heartbeat instead: unhealthy when the last billing-job heartbeat is
    # older than 3 x SCHEDULER_INTERVAL_MINUTES (min 15 min). Builds without heartbeat
    # support report healthy. Also surfaced as features.scheduler_heartbeat in
    # GET /api/v1/health/ready.
    healthcheck:
      test: ["CMD", "python", "/app/backend/docker/scheduler_healthcheck.py"]
      interval: 2m
      timeout: 20s
      retries: 3
      start_period: 3m
    mem_limit: ${SCHEDULER_MEM_LIMIT:-512m}
    cpus: ${SCHEDULER_CPUS:-0.5}
    logging: *default-logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    # Explicit variables only (no env_file): DB credentials, backup/offsite settings and
    # the alert webhook. See deploy/backup.sh for what each one does.
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      BACKUP_DIR: /var/backups/rooman
      UPLOADS_DIR: /uploads
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_CRON: ${BACKUP_CRON:-15 1 * * *}
      BACKUP_MAX_AGE_MINUTES: ${BACKUP_MAX_AGE_MINUTES:-1560}
      BACKUP_HOST_LABEL: ${BACKUP_HOST_LABEL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Offsite copy via rclone. OFFSITE_BACKUP_REMOTE="offsite:<bucket>/<prefix>"; the
      # "offsite" remote is defined by the RCLONE_CONFIG_OFFSITE_* variables below
      # (S3 / Backblaze B2 S3 / Wasabi / Cloudflare R2 / MinIO...). Empty = local only.
      OFFSITE_BACKUP_REMOTE: ${OFFSITE_BACKUP_REMOTE:-}
      OFFSITE_RETENTION_DAYS: ${OFFSITE_RETENTION_DAYS:-}
      OFFSITE_REQUIRED: ${OFFSITE_REQUIRED:-true}
      RCLONE_CONFIG_OFFSITE_TYPE: ${OFFSITE_RCLONE_TYPE:-s3}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_S3_PROVIDER:-AWS}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${OFFSITE_S3_REGION:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes:
      - backup_data:/var/backups/rooman
      - uploads_data:/uploads:ro
      # Nested mount so the uploads tarball also captures private expense receipts.
      - private_uploads_data:/uploads/_private_uploads:ro
      # Synced from the repo by deploy/deploy-poll.sh together with this file.
      - ./deploy/backup.sh:/usr/local/bin/backup-job.sh:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache rclone curl >/dev/null 2>&1           || echo "[backup] WARNING: could not install rclone/curl - offsite upload and alerts unavailable" >&2
        # cron output goes to the container log (docker compose logs backup).
        echo "$$BACKUP_CRON sh /usr/local/bin/backup-job.sh > /proc/1/fd/1 2> /proc/1/fd/2" > /etc/crontabs/root
        sh /usr/local/bin/backup-job.sh           || echo "[backup] initial backup failed (alert sent if configured); will retry on schedule" >&2
        exec crond -f -l 8
    # Unhealthy when no successful backup in BACKUP_MAX_AGE_MINUTES (default 26 h).
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /var/backups/rooman/last_success -mmin -$${BACKUP_MAX_AGE_MINUTES:-1560} 2>/dev/null)\""]
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 15m
    mem_limit: ${BACKUP_MEM_LIMIT:-256m}
    cpus: ${BACKUP_CPUS:-0.5}
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
    # Pulled from GHCR by deploy/deploy-poll.sh in normal operation; `build:` above is
    # kept so `docker compose up -d --build` still works for a manual/local rebuild.
    image: ghcr.io/rooman-itsd/rooman-billing-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-80}:80"
    depends_on:
      # Wait for backend's healthcheck to actually pass, not just for the container to
      # start - gunicorn/uvicorn take a few seconds to boot, and nginx would otherwise
      # start proxying to a backend that isn't accepting connections yet (seen in
      # practice as a handful of 502s right after a rollout).
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    cpus: ${FRONTEND_CPUS:-0.5}
    logging: *default-logging

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  private_uploads_data:
    driver: local
  backup_data:
    driver: local
