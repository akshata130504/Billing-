# Rooman Billing - production stack.
#
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Services
#   db         PostgreSQL 16 with a named volume (not published to the host)
#   backend    FastAPI via gunicorn/uvicorn; runs migrations on start; SCHEDULER_ENABLED=false
#   scheduler  same image, one instance, SCHEDULER_ENABLED=true - runs renewals /
#              trial conversion / overdue marking / dunning. REQUIRED: nothing else runs them.
#   frontend   nginx serving the SPA and proxying /api/ to backend:8000 (port 80)
#
# TLS: terminate HTTPS in front of `frontend` (see docker-compose.caddy.yml and
# docs/deployment.md). Set FRONTEND_BIND=127.0.0.1:8080 in .env.production when a
# reverse proxy on the host or the caddy overlay owns ports 80/443.

name: rooman-billing

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB are read straight from the env file.
    env_file: .env.production
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Deliberately no `ports:` - only containers on the compose network reach the DB.
    # For an admin session use: docker compose -f docker-compose.prod.yml exec db psql -U $POSTGRES_USER $POSTGRES_DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 256m
    logging: &default-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Deliberately no published ports: only internal containers on the compose network reach Redis.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Pulled from GHCR by deploy/deploy-poll.sh in normal operation; `build:` above is
    # kept so `docker compose up -d --build` still works for a manual/local rebuild.
    image: ghcr.io/rooman-itsd/rooman-billing-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      # The API replicas never run background jobs; the `scheduler` service does.
      SCHEDULER_ENABLED: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RUN_MIGRATIONS: "true"
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Not published: the frontend container proxies /api/. Uncomment for local debugging only.
    # ports:
    #   - "127.0.0.1:8000:8000"
    # Liveness only: /api/v1/health is a SELECT 1 and always returns 200. The deep probe
    # GET /api/v1/health/ready returns 503 while migrations are behind - use that one for a
    # load balancer or a deploy gate, not here (it would flap during the migration step).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging

  scheduler:
    image: ghcr.io/rooman-itsd/rooman-billing-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      # REQUIRED. Without exactly one process running with this enabled, subscription
      # renewals, trial conversion, overdue marking and dunning silently never happen.
      # Never set it to "true" on `backend` as well: that produces duplicate invoices.
      SCHEDULER_ENABLED: "true"
      RUN_MIGRATIONS: "false"      # backend already migrated; avoid two migrators racing
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - uploads_data:/app/backend/uploads
    # Exactly ONE instance of this service may run. `run_forever` is provided by
    # backend/app/services/scheduler.py and blocks while APScheduler runs the jobs.
    command: ["python", "-c", "from backend.app.services.scheduler import run_forever; run_forever()"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
    healthcheck:
      disable: true
    logging: *default-logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      BACKUP_DIR: /var/backups/rooman
      BACKUP_RETENTION_DAYS: 30
    volumes:
      - backup_data:/var/backups/rooman
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /var/backups/rooman
        cat << 'EOF' > /usr/local/bin/backup-job.sh
        #!/bin/sh
        set -e
        DATE=$$(date +%Y%m%d_%H%M%S)
        FILENAME=/var/backups/rooman/rooman_$${DATE}.dump
        echo "[$$(date -Iseconds)] [backup] Starting scheduled database backup to $${FILENAME}..."
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        if pg_dump -h "$$POSTGRES_SERVER" -p "$$POSTGRES_PORT" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" --no-owner --format=custom -f "$$FILENAME"; then
            echo "[$$(date -Iseconds)] [backup] Database backup completed successfully: $$(ls -lh "$$FILENAME")"
            echo "[$$(date -Iseconds)] [backup] Cleaning up dumps older than $${BACKUP_RETENTION_DAYS:-30} days..."
            find /var/backups/rooman -name 'rooman_*.dump' -mtime +$${BACKUP_RETENTION_DAYS:-30} -delete
            echo "[$$(date -Iseconds)] [backup] Cleanup complete. Retention policy maintained."
            if [ -n "$$OFFSITE_BACKUP_COMMAND" ]; then
                echo "[$$(date -Iseconds)] [backup] Running offsite backup command..."
                eval "$$OFFSITE_BACKUP_COMMAND" || echo "[$$(date -Iseconds)] [backup] WARNING: Offsite backup command failed." >&2
            fi
        else
            echo "[$$(date -Iseconds)] [backup] ERROR: pg_dump failed!" >&2
            exit 1
        fi
        EOF
        chmod +x /usr/local/bin/backup-job.sh
        /usr/local/bin/backup-job.sh || echo "[backup] Initial backup attempt encountered error, will retry on schedule."
        echo "15 1 * * * /usr/local/bin/backup-job.sh" > /etc/crontabs/root
        exec crond -f -l 2
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Pulled from GHCR by deploy/deploy-poll.sh in normal operation; `build:` above is
    # kept so `docker compose up -d --build` still works for a manual/local rebuild.
    image: ghcr.io/rooman-itsd/rooman-billing-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-80}:80"
    depends_on:
      # Wait for backend's healthcheck to actually pass, not just for the container to
      # start - gunicorn/uvicorn take a few seconds to boot, and nginx would otherwise
      # start proxying to a backend that isn't accepting connections yet (seen in
      # practice as a handful of 502s right after a rollout).
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  backup_data:
    driver: local
