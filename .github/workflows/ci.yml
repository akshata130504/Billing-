name: CI

on:
  push:
    branches: ["main", "develop", "feature/**", "release/**", "hotfix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (pytest + migrations on PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rooman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rooman_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Non-production environment so config.py's production safety checks stay off,
      # while still exercising real settings paths.
      ENVIRONMENT: test
      DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef  # gitleaks:allow (throwaway CI value)
      SCHEDULER_ENABLED: "false"
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Byte-compile (catches syntax errors early)
        run: python -m compileall -q backend/app backend/alembic

      - name: Lint (ruff - real-error rules only, see backend/ruff.toml)
        run: ruff check backend

      - name: Dependency vulnerability audit (pip-audit)
        # BLOCKING: any known vulnerability in a pinned runtime dependency fails the build.
        run: pip-audit -r backend/requirements.txt --progress-spinner off

      - name: Validate Alembic migrations (upgrade, drift check, downgrade -1, re-upgrade)
        # Separate database from the test suite so drop_all/create_all in
        # conftest.py never interferes with what the migrations create.
        # Every command is BLOCKING (bash -e): a failing migration, a broken downgrade of
        # the newest revision, or model/migration drift (`alembic check`) fails the build.
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rooman_migrate
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE rooman_migrate;'
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini current --verbose
          alembic -c backend/alembic.ini check
          alembic -c backend/alembic.ini downgrade -1
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini check

      - name: Row level security as the production runtime role (NOSUPERUSER, NOBYPASSRLS)
        # The `postgres` service user is a superuser and ignores every RLS policy, so RLS is
        # only verified here: the migrated rooman_migrate database gets the least-privilege
        # role from deploy/sql/least_privilege.sql and the RLS suite connects as that role.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rooman_test
          LEAST_PRIVILEGE_DATABASE_URL: postgresql+psycopg://rooman_app_ci:ci-runtime-role-password@localhost:5432/rooman_migrate
          LEAST_PRIVILEGE_OWNER_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rooman_migrate
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d rooman_migrate -X -v ON_ERROR_STOP=1 \
            -v app_role=rooman_app_ci -v app_password=ci-runtime-role-password \
            -f deploy/sql/least_privilege.sql
          # test_least_privilege: grants/ownership of the runtime role; test_rls_coverage: every tenant
          # table has the same forced tenant policy, probed as a NOBYPASSRLS role.
          pytest -q -rs backend/tests/test_rls_runtime_role.py backend/tests/test_least_privilege.py \
            backend/tests/test_rls_coverage.py 2>&1 | tee /tmp/rls.txt
          # A skipped RLS test must fail the gate, not pass it silently.
          ! grep -qi "skipped" /tmp/rls.txt

      - name: Security test suite on PostgreSQL (explicit gate)
        # Run the security-critical tests on their own so a failure is unmistakable in the
        # log (they also run again as part of the full suite below).
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rooman_test
        run: |
          pytest -q             backend/tests/test_security_audit_remediation.py             backend/tests/test_auth*.py             backend/tests/test_payments_hardening.py             backend/tests/test_hosted_checkout_payments.py             backend/tests/test_webhooks.py             backend/tests/test_postgres_concurrency.py             backend/tests/test_config_security.py

      - name: Run test suite on PostgreSQL
        # Includes backend/tests/test_migrations.py::test_postgres_enums_match_python_enums
        # and ::test_postgres_migrated_schema_matches_models, which run `alembic upgrade head`
        # into scratch databases and compare enum labels / the whole schema with the models.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rooman_test
        run: pytest -q

  frontend:
    name: Frontend (tsc + vitest + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

      - name: Dependency vulnerability audit - production deps (npm audit, BLOCKING)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency vulnerability audit - all deps incl. dev tooling (informational)
        # NON-BLOCKING: dev-only tooling (vite, vitest...) never ships to users; review the log.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Production build
        env:
          VITE_API_BASE_URL: ""
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit in the pushed / PR range.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          # Automatic per-run token (no repository secret needs to be configured); used
          # only to read PR commits. Findings are redacted in the log.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, secret-scan]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: false
          tags: rooman-billing-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          load: false
          tags: rooman-billing-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
