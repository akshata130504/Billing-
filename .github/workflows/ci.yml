name: CI

on:
  push:
    branches: ["main", "develop", "feature/**", "release/**", "hotfix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (pytest + migrations on PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rooman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rooman_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Non-production environment so config.py's production safety checks stay off,
      # while still exercising real settings paths.
      ENVIRONMENT: test
      DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      SCHEDULER_ENABLED: "false"
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Byte-compile (catches syntax errors early)
        run: python -m compileall -q backend/app backend/alembic

      - name: Apply Alembic migrations against a fresh database
        # Separate database from the test suite so drop_all/create_all in
        # conftest.py never interferes with what the migrations create.
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rooman_migrate
        run: |
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE rooman_migrate;'
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini current --verbose
          # Warn (do not fail) when the models have drifted from the migrations.
          alembic -c backend/alembic.ini check || echo "::warning title=Alembic drift::Models differ from the migrations; run 'alembic revision --autogenerate'"


      - name: Run test suite on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rooman_test
        run: pytest -q

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        env:
          VITE_API_BASE_URL: ""
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: false
          tags: rooman-billing-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          load: false
          tags: rooman-billing-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
